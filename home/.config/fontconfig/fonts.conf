<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font choices for this account (fontconfig).
  Arabic: use Noto Sans Arabic UI, a compact interface font (similar to the
  Segoe UI that Windows uses), which joins the letters properly. Without this, some
  apps (Discord, for example) got FreeMono for Arabic, which shows each letter
  separately and spaced out.
  Apply changes with: fc-cache -f   (then restart the app)
-->
<fontconfig>
  <!-- Normal text: Noto Sans, and Noto Sans Arabic for Arabic letters -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic UI</family>
    </prefer>
  </alias>

  <!-- Apps that ask for Helvetica or Arial get the same fonts -->
  <alias binding="same">
    <family>Helvetica Neue</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic UI</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic UI</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic UI</family>
    </prefer>
  </alias>

  <!-- Serif text: Noto Serif, and Noto Naskh Arabic for Arabic letters -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Naskh Arabic</family>
    </prefer>
  </alias>

  <!-- Monospace (code, terminals): JetBrains Mono, then Noto Sans Arabic -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Arabic UI</family>
    </prefer>
  </alias>

  <!-- FreeMono and FreeSerif have Arabic letters but join them poorly, so never use them -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/gnu-free/FreeMono*</glob>
      <glob>/usr/share/fonts/gnu-free/FreeSerif*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>

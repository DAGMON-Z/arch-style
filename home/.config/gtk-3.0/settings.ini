# GTK 3 apps: dark theme, Papirus icons, cursor and font
# Colors are in gtk.css next to this file
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=capitaine-cursors
gtk-cursor-theme-size=24
gtk-font-name=Adwaita Sans 11
gtk-application-prefer-dark-theme=1
# Title bar buttons: only close. Hyprland ignores minimize, and hyprland.lua ignores maximize;
# use SUPER+S to hide a window and SUPER+F to maximize it
gtk-decoration-layout=menu:close

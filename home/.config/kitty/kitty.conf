# kitty terminal settings
# Reload after editing with ctrl+shift+f5

# Colors live in their own file
include tokyo-night.conf

# Font
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# See-through background. Hyprland blurs what is behind it.
background_opacity 0.85

# Space between the text and the window edge: vertical, then horizontal
window_padding_width 8 12

# Tabs
tab_bar_edge     bottom
tab_bar_style    powerline
tab_powerline_style round
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_shape beam
cursor_blink_interval 0.5

# Ctrl+Shift+Z = redo, in Neovim and in the zsh shell. kitty sends it as this
# code (instead of scrolling to the previous prompt), so both can recognize it.
map ctrl+shift+z send_text all \x1b[122;6u

# Close windows without asking, even when a program like Neovim is running.
# Save in Neovim (Ctrl+S) before closing, or unsaved changes are only in its recovery file.
confirm_os_window_close 0

# hyprlock: Tokyo Night lock screen
# Clear the password box with Esc, Ctrl+U or Ctrl+Backspace

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# A blurred, darkened picture of your desktop
background {
    monitor =
    path = @HOME@/.local/share/wallpaper/current.jpg
    color = rgb(26, 27, 38)
    blur_passes = 2
    blur_size = 5
    brightness = 0.65
    vibrancy = 0.17
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 14

    inner_color = rgba(26, 27, 38, 0.85)
    font_color = rgb(192, 202, 245)

    # Border colors: normal, checking, wrong password, Caps Lock on
    outer_color = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    check_color = rgba(e0af68ff)
    fail_color = rgba(f7768eff)
    capslock_color = rgba(ff9e64ff)

    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##565f89">Password</span>
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3

    position = 0, -70
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    color = rgb(192, 202, 245)
    font_size = 96
    font_family = $font ExtraBold

    position = 0, 130
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(122, 162, 247)
    font_size = 20
    font_family = $font

    position = 0, 45
    halign = center
    valign = center
}

# Keyboard layout. Check this before typing your password. Click to switch.
label {
    monitor =
    text = &##xF11C;  $LAYOUT[us,ar]
    color = rgb(255, 158, 100)
    font_size = 15
    font_family = $font
    onclick = hyprctl switchxkblayout all next

    position = 0, -130
    halign = center
    valign = center
}

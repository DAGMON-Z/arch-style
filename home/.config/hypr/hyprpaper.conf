# hyprpaper: desktop wallpaper
# To change it, edit "path" below, then restart hyprpaper:
#   pkill -x hyprpaper; hyprctl dispatch 'hl.dsp.exec_cmd("hyprpaper")'

splash = false

wallpaper {
    # Empty means every monitor
    monitor =
    path = @HOME@/Pictures/Wallpapers/tokyo-night-city.jpg
    fit_mode = cover
}

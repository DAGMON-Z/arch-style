# hypridle: what happens when you stop using the laptop
# Apply changes with: systemctl --user restart hypridle

general {
    # Start hyprlock only if it is not already running
    lock_cmd = pidof hyprlock || hyprlock
    # Always lock before suspending
    before_sleep_cmd = loginctl lock-session
    # Turn the screen back on after waking up
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# No lock after a few idle minutes: it was turned off on purpose.
# To lock after 5 minutes again, add this back:
# listener {
#     timeout = 300
#     on-timeout = loginctl lock-session
# }

# Suspend after 15 minutes
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
